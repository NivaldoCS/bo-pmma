<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3a6e">
  <meta name="description" content="Preenchimento de boletins de ocorrência da PMMA no próprio aparelho, sem servidor.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src blob:; object-src blob:; base-uri 'self'; form-action 'none'">
  <title>Boletim de Ocorrência — PMMA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icone-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <div class="marca">BO PMMA<small id="topo-sub"></small></div>
    <button type="button" id="btn-inicio" aria-label="Ir para o início">Início</button>
  </header>
  <main>
    <div id="app" aria-live="polite">
      <p>Carregando…</p>
      <noscript><div class="aviso erro">Este site precisa de JavaScript ativado.</div></noscript>
    </div>
    <p class="status-offline" id="status-offline"></p>
  </main>
  <nav class="rodape-nav oculto" id="nav-etapas" aria-label="Navegação entre etapas">
    <button type="button" class="btn" id="btn-anterior">← Anterior</button>
    <button type="button" class="btn primario" id="btn-proxima">Próxima →</button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
